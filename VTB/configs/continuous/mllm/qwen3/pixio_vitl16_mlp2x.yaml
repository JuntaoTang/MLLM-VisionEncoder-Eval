experiment:
  description: Qwen3-1.7B + Pixio ViT-L/16 @256 + mlp2x
llm: qwen3_1p7b
vision_encoder: pixio_vitl16
projector: mlp2x
eval:
  conv_mode: qwen_3
train:
  pretrain:
    learning_rate: 0.001
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 16
    peak_vram_gb: 9.99
    probe_note: probed max micro=8; effective=128/GPU; peak_vram=9.99GB; max_steps=3;
      1xA100
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    peak_vram_gb: 20.39
    probe_note: probed max micro=4; effective=32/GPU; peak_vram=20.39GB; max_steps=3;
      1xA100
