# Qwen3-1.7B + EUPE-ConvNeXt-S
experiment:
  description: "Qwen3-1.7B + EUPE-ConvNeXt-S + mlp2x"

llm: qwen3_1p7b
vision_encoder: eupe_convnext_s
projector: mlp2x

eval:
  conv_mode: qwen_3

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 128
    gradient_accumulation_steps: 1
    peak_vram_gb: 38.57
    probe_note: probed max micro=128; effective=128/GPU; peak_vram=38.57GB; max_steps=2;
      1xA100
  finetune:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 1
    peak_vram_gb: 66.96
    probe_note: probed max micro=32; effective=32/GPU; peak_vram=66.96GB; max_steps=2;
      1xA100
