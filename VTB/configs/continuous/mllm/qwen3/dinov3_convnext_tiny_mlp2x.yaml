# Qwen3-1.7B + DINOv3 ConvNeXt-T @256
experiment:
  description: "Qwen3-1.7B + DINOv3 ConvNeXt-T @256 + mlp2x"

llm: qwen3_1p7b
vision_encoder: dinov3_convnext_tiny
projector: mlp2x

eval:
  conv_mode: qwen_3

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
    peak_vram_gb: 74.88
    probe_note: probed max micro=32; effective=128/GPU; peak_vram=74.88GB; max_steps=3;
      1xA100
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    peak_vram_gb: 79.21
    probe_note: probed max micro=4; effective=32/GPU; peak_vram=79.21GB; max_steps=3;
      1xA100
