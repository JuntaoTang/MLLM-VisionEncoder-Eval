# SmolLM2-1.7B-Instruct + ViT-SO400M-16-SigLIP2-512
experiment:
  description: "SmolLM2-1.7B-Instruct + ViT-SO400M-16-SigLIP2-512 + mlp2x"

llm: smollm2_1p7b
vision_encoder: siglip2_sm16_512
projector: mlp2x

eval:
  conv_mode: smollm2

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 16
    peak_vram_gb: 69.77
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    visual_tokens: 1024
    peak_vram_gb: 64.64
    probe_note: 'throughput-first: match 07_14_0 regime; effective=32/GPU; drop chars>=8000;
      no per-step empty_cache'
