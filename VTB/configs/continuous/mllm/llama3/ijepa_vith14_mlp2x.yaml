# Llama-3.2-1B + I-JEPA ViT-H/14 @224
experiment:
  description: "Llama-3.2-1B + I-JEPA ViT-H/14 @224 + mlp2x"

llm: llama3_2_1b
vision_encoder: ijepa_vith14
projector: mlp2x

eval:
  conv_mode: llava_llama_3

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 16
    probe_note: ViT-H/14 dim=1280; conservative start
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    visual_tokens: 256
    probe_note: ViT-H/14 conservative; use adaptive script to raise
