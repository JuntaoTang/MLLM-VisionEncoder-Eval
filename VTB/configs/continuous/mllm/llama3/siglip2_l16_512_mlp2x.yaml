# Llama-3.2-1B + ViT-L-16-SigLIP2-512
experiment:
  description: "Llama-3.2-1B + ViT-L-16-SigLIP2-512 + mlp2x"

llm: llama3_2_1b
vision_encoder: siglip2_l16_512
projector: mlp2x

eval:
  conv_mode: llava_llama_3

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 16
    peak_vram_gb: 69.11
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    visual_tokens: 1024
    probe_note: 'throughput-first: match 07_14_0 regime; effective=32/GPU; drop chars>=8000;
      no per-step empty_cache'
