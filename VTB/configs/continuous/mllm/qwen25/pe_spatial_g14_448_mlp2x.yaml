# Qwen2.5-1.5B-Instruct + PE-Spatial-G14-448
experiment:
  description: "Qwen2.5-1.5B-Instruct + PE-Spatial-G14-448 + mlp2x"

llm: qwen2p5_1p5b
vision_encoder: pe_spatial_g14_448
projector: mlp2x

eval:
  conv_mode: qwen_2_5

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
    peak_vram_gb: 69.99
    probe_note: probed max micro=32; effective=128/GPU; peak_vram=69.99GB; max_steps=2;
      1xA100
  finetune:
    per_device_train_batch_size: 16
    gradient_accumulation_steps: 2
    peak_vram_gb: 65.54
    probe_note: probed max micro=16; effective=32/GPU; peak_vram=65.54GB; max_steps=2;
      1xA100
