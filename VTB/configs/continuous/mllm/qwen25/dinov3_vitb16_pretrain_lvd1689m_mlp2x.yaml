experiment:
  description: Qwen2.5-1.5B-Instruct + dinov3 vitb16 pretrain lvd1689m + mlp2x
llm: qwen2p5_1p5b
vision_encoder: dinov3_vitb16_pretrain_lvd1689m
projector: mlp2x
eval:
  conv_mode: qwen_2_5
train:
  pretrain:
    learning_rate: 0.001
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
    peak_vram_gb: 25.44
    probe_note: probed max micro=32; effective=128/GPU; peak_vram=25.44GB; max_steps=3;
      1xA100
  finetune:
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 32
    peak_vram_gb: 15.55
    probe_note: probed max micro=1; effective=32/GPU; peak_vram=15.55GB; max_steps=3;
      1xA100
