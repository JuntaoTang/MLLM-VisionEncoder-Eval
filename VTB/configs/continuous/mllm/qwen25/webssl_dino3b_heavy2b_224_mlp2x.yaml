# Qwen2.5-1.5B-Instruct + webssl dino3b heavy2b 224
experiment:
  description: "Qwen2.5-1.5B-Instruct + webssl dino3b heavy2b 224 + mlp2x"

llm: qwen2p5_1p5b
vision_encoder: webssl_dino3b_heavy2b_224
projector: mlp2x

eval:
  conv_mode: qwen_2_5

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 64
    gradient_accumulation_steps: 2
    peak_vram_gb: 52.15
    probe_note: probed max micro=64; effective=128/GPU; peak_vram=52.15GB; max_steps=2;
      1xA100
  finetune:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 1
    peak_vram_gb: 75.2
    probe_note: probed max micro=32; effective=32/GPU; peak_vram=75.20GB; max_steps=2;
      1xA100
