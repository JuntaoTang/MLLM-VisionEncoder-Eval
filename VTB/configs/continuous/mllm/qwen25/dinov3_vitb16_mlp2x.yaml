# Qwen2.5-1.5B-Instruct + DINOv3 ViT-B/16 @256
experiment:
  description: "Qwen2.5-1.5B-Instruct + DINOv3 ViT-B/16 @256 + mlp2x"

llm: qwen2p5_1p5b
vision_encoder: dinov3_vitb16
projector: mlp2x

eval:
  conv_mode: qwen_2_5

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 64
    peak_vram_gb: 67.0
    probe_note: probed max micro=2; effective=128/GPU; peak_vram=67.00GB; max_steps=3;
      1xA100
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    peak_vram_gb: 79.1
    probe_note: probed max micro=4; effective=32/GPU; peak_vram=79.10GB; max_steps=3;
      1xA100
