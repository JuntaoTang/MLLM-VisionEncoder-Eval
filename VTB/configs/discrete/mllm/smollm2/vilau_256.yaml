# SmolLM2-1.7B-Instruct + VILA-U @256
experiment:
  description: "SmolLM2-1.7B-Instruct + VILA-U @256 + mlp2x projector"

llm: smollm2_1p7b
tokenizer: vilau_256
projector: mlp2x
arch:
  vis_mode: vilau
batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    peak_vram_gb: 63.17
