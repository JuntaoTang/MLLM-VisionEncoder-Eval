# SmolLM2-1.7B-Instruct + BitDance / UniWeTok d32c128
experiment:
  description: "SmolLM2-1.7B-Instruct + BitDance / UniWeTok d32c128 + mlp2x projector"

llm: smollm2_1p7b
tokenizer: bitdance_d32c128
projector: mlp2x
arch:
  vis_mode: bitdance

batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8

