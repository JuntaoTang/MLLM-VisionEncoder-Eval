# Llama-3.2-1B + VILA-U @256
experiment:
  description: "Llama-3.2-1B + VILA-U @256 + mlp2x projector"

llm: llama3_2_1b
tokenizer: vilau_256
projector: mlp2x
arch:
  vis_mode: vilau
batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    peak_vram_gb: 63.17
