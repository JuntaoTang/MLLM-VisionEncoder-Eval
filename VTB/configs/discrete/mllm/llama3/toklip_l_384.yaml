# Llama-3.2-1B + TokLIP-L @384
experiment:
  description: "Llama-3.2-1B + TokLIP-L @384 + mlp2x projector"

llm: llama3_2_1b
tokenizer: toklip_l_384
projector: mlp2x
arch:
  vis_mode: toklip_post_quant
batch:
  pretrain:
    per_device_train_batch_size: 16
    gradient_accumulation_steps: 8
    peak_vram_gb: 46.39
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    peak_vram_gb: 63.17
