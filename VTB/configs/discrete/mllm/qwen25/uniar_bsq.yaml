# Qwen2.5-1.5B-Instruct + UniAR BSQ
experiment:
  description: "Qwen2.5-1.5B-Instruct + UniAR BSQ + mlp2x projector"

llm: qwen2p5_1p5b
tokenizer: uniar_bsq
projector: mlp2x
arch:
  vis_mode: uniar

batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8

