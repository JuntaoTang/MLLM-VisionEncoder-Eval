# Qwen2.5-1.5B-Instruct + TokLIP-S @256
experiment:
  description: "Qwen2.5-1.5B-Instruct + TokLIP-S @256 + mlp2x projector"

llm: qwen2p5_1p5b
tokenizer: toklip_s_256
projector: mlp2x
arch:
  vis_mode: toklip_post_quant
batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    peak_vram_gb: 63.17
