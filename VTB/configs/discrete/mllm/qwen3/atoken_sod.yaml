# Qwen3-1.7B + AToken-So/D
experiment:
  description: "Qwen3-1.7B + AToken-So/D + mlp2x projector"

llm: qwen3_1p7b
tokenizer: atoken_sod
projector: mlp2x
arch:
  vis_mode: atoken

batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8

