# Qwen2.5-1.5B-Instruct + ViT-L-16-SigLIP2-256
experiment:
  description: "Qwen2.5-1.5B-Instruct + ViT-L-16-SigLIP2-256 + mlp2x"

llm: qwen2p5_1p5b
vision_encoder: siglip2_l16_256
projector: mlp2x

eval:
  conv_mode: qwen_2_5

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 16
    gradient_accumulation_steps: 8
    peak_vram_gb: 15.43
  finetune:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 4
    visual_tokens: 256
    probe_note: 'throughput-first: match 07_14_0 regime; effective=32/GPU; drop chars>=8000;
      no per-step empty_cache'
