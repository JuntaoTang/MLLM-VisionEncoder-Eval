# Qwen3-1.7B + MC2 S16 224 MT5
experiment:
  description: "Qwen3-1.7B + MC2 S16 224 MT5 + mlp2x"

llm: qwen3_1p7b
vision_encoder: mc2_s16_224_mt5
projector: mlp2x

eval:
  conv_mode: qwen_3

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 64
    gradient_accumulation_steps: 2
    peak_vram_gb: 71.88
  finetune:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 4
    visual_tokens: 196
    probe_note: 'throughput-first: match 07_14_0 regime; effective=32/GPU; drop chars>=8000;
      no per-step empty_cache'
