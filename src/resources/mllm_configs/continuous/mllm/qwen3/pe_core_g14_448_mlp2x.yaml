# Qwen3-1.7B + PE-Core-G14-448
experiment:
  description: "Qwen3-1.7B + PE-Core-G14-448 + mlp2x"

llm: qwen3_1p7b
vision_encoder: pe_core_g14_448
projector: mlp2x

eval:
  conv_mode: qwen_3

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
    peak_vram_gb: 71.73
    probe_note: probed max micro=32; effective=128/GPU; peak_vram=71.73GB; max_steps=2;
      1xA100
  finetune:
    per_device_train_batch_size: 16
    gradient_accumulation_steps: 2
    peak_vram_gb: 67.09
    probe_note: probed max micro=16; effective=32/GPU; peak_vram=67.09GB; max_steps=2;
      1xA100
