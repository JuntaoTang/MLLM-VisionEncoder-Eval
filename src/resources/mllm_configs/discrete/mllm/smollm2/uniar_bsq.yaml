# SmolLM2-1.7B-Instruct + UniAR BSQ
experiment:
  description: "SmolLM2-1.7B-Instruct + UniAR BSQ + mlp2x projector"

llm: smollm2_1p7b
tokenizer: uniar_bsq
projector: mlp2x
arch:
  vis_mode: uniar

batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
