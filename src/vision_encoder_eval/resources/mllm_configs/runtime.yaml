# Shared runtime — python run.py --mode continuous|discrete
# Multi-model: each entry runs stages [pretrain, finetune, test] in order.
# Completed runs are recorded in results/finish.json (skipped on re-run).

batch:
  num_gpus: 8

data_config: configs/data.yaml

checkpoints:
  pretrain_resume: null
  finetune_resume: null
  finetune_init: null

runtime:
  cuda_visible_devices: "0,1,2,3,4,5,6,7"
  master_port: 29501
  dataloader_num_workers: 8

continuous:
  mllm:
    - qwen25/clip_openai__l14_mlp2x
  stages: [pretrain,finetune, test]
  train_config: configs/continuous/train.yaml
  output:
    base_dir: /cache/ckpt/trained/continuous
  runtime:
    log_dir: logs/continuous
  pipeline:
    overlap_test_pretrain: false
  eval:
    model: null
    mllm: null
    backend: vlmevalkit
    cuda_visible_devices: "0,1,2,3,4,5,6,7"
    parallel_datasets: true
    max_infer_workers: 8
    max_samples: 1000
    sample_seed: 42
    sampling: vlmevalkit
    datasets:
      - MMMU_TEST
      - MMBench_TEST_EN_V11
      - VQAv2_VAL
      - ScienceQA_VAL
      - ChartQA_TEST
      - DocVQA_VAL
      - TextVQA_VAL
      - POPE
      - GQA_TestDev_Balanced
      - MSCOCO_KARPATHY_TEST
      - FLICKR30K_KARPATHY_TEST
    use_checkpoint: finetune
    max_new_tokens: 128
    vlmeval_mode: infer
    # Local LLM judge for MMMU/MMBench; VQA/caption stay rule-based.
    # Prefer 1 GPU/dataset for infer; leftover card(s) hold the judge.
    # If cards are short: infer_then_judge (all infer first, then load judge).
    judge: Qwen3-32B
    judge_model_path: /cache/ckpt/download/llm/Qwen3-32B
    judge_num_gpus: 1
    judge_gpu_placement: last
    judge_nproc: 4
    reuse: false
    log_every: 50
    attn_implementation: sdpa

discrete:
  recipe:
    - qwen25/toklip_l_384
  finetune_tag: mix
  stages: [pretrain, finetune, test]
  train_config: configs/discrete/train.yaml
  output:
    base_dir: /cache/ckpt/trained/discrete
  runtime:
    log_dir: logs/discrete
  eval:
    model: null
    recipe: null
    backend: vlmevalkit
    vlm_class: VTB_Discrete_VLM
    cuda_visible_devices: "0,1,2,3,4,5,6,7"
    parallel_datasets: true
    max_samples: 1000
    sample_seed: 42
    sampling: vlmevalkit
    datasets:
      - MMMU_TEST
      - MMBench_TEST_EN_V11
      - VQAv2_VAL
      - ScienceQA_VAL
      - ChartQA_TEST
      - DocVQA_VAL
      - TextVQA_VAL
      - POPE
      - GQA_TestDev_Balanced
      - MSCOCO_KARPATHY_TEST
      - FLICKR30K_KARPATHY_TEST
    judge: Qwen3-32B
    judge_model_path: /cache/ckpt/download/llm/Qwen3-32B
    judge_num_gpus: 1
    judge_gpu_placement: last
    judge_nproc: 4
    use_checkpoint: finetune
    max_new_tokens: 128
    vlmeval_mode: infer
    reuse: false
    max_infer_workers: 8
    log_every: 50
