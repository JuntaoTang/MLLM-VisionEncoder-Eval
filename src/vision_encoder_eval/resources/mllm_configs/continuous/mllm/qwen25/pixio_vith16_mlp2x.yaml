# Qwen2.5-1.5B-Instruct + Pixio ViT-H/16 @256
experiment:
  description: "Qwen2.5-1.5B-Instruct + Pixio ViT-H/16 @256 + mlp2x"

llm: qwen2p5_1p5b
vision_encoder: pixio_vith16
projector: mlp2x

eval:
  conv_mode: qwen_2_5

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 16
    peak_vram_gb: 73.2
    probe_note: probed max micro=8; effective=128/GPU; peak_vram=73.20GB; max_steps=3;
      1xA100
  finetune:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 16
    peak_vram_gb: 79.18
    probe_note: probed max micro=2; effective=32/GPU; peak_vram=79.18GB; max_steps=3;
      1xA100
