# Qwen2.5-1.5B-Instruct + webssl mae300m full2b 224
experiment:
  description: "Qwen2.5-1.5B-Instruct + webssl mae300m full2b 224 + mlp2x"

llm: qwen2p5_1p5b
vision_encoder: webssl_mae300m_full2b_224
projector: mlp2x

eval:
  conv_mode: qwen_2_5

train:
  pretrain:
    learning_rate: 1.0e-3
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 128
    gradient_accumulation_steps: 1
    peak_vram_gb: 73.63
    probe_note: probed max micro=128; effective=128/GPU; peak_vram=73.63GB; max_steps=2;
      1xA100
  finetune:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 1
    peak_vram_gb: 66.35
    probe_note: probed max micro=32; effective=32/GPU; peak_vram=66.35GB; max_steps=2;
      1xA100
