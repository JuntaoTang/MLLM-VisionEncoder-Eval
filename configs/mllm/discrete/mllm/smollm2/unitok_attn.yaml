# SmolLM2-1.7B-Instruct + UniTok attn quant_proj
experiment:
  description: "SmolLM2-1.7B-Instruct + UniTok attn quant_proj + mlp2x projector"

llm: smollm2_1p7b
tokenizer: unitok_attn
projector: mlp2x
batch:
  pretrain:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 4
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    peak_vram_gb: 63.17
