# Qwen3-1.7B + TokLIP-L @384
experiment:
  description: "Qwen3-1.7B + TokLIP-L @384 + mlp2x projector"

llm: qwen3_1p7b
tokenizer: toklip_l_384
projector: mlp2x
arch:
  vis_mode: toklip_post_quant
batch:
  pretrain:
    per_device_train_batch_size: 16
    gradient_accumulation_steps: 8
    peak_vram_gb: 46.39
  finetune:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    peak_vram_gb: 63.17
