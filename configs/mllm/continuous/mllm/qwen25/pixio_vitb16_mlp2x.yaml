experiment:
  description: Qwen2.5-1.5B-Instruct + Pixio ViT-B/16 @256 + mlp2x
llm: qwen2p5_1p5b
vision_encoder: pixio_vitb16
projector: mlp2x
eval:
  conv_mode: qwen_2_5
train:
  pretrain:
    learning_rate: 0.001
    warmup_ratio: 0.05
    max_grad_norm: 1.0
    gradient_checkpointing: true
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    tf32: true
    dataloader_drop_last: true
  finetune:
    max_grad_norm: 1.0
    gradient_checkpointing_kwargs: '{"use_reentrant": false}'
    dataloader_drop_last: true
batch:
  pretrain:
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 16
    peak_vram_gb: 13.68
    probe_note: probed max micro=8; effective=128/GPU; peak_vram=13.68GB; max_steps=3;
      1xA100
  finetune:
    per_device_train_batch_size: 32
    gradient_accumulation_steps: 1
    peak_vram_gb: 78.52
    probe_note: probed max micro=32; effective=32/GPU; peak_vram=78.52GB; max_steps=3;
      1xA100
