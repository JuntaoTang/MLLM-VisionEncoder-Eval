schema_version: 1
experiment: {name: discrete_configured_train, kind: mllm_train}
dataset: lcs558k_mix665k_filtered
required_paths: [datasets, download, trained]
inputs:
  pretrain: ${paths.datasets}/instructions/pretrain/blip_laion_cc_sbu_558k.json
  finetune: ${paths.datasets}/instructions/finetune/llava_v1_5_mix665k_drop_ge8kchars.json
  images: ${paths.datasets}/images
  checkpoints: ${paths.download}
steps:
  - worker: mllm.pipeline
    arguments: [--mode, discrete, --config, '${workspace}/configs/runtime.yaml', --stages, pretrain, finetune]
    outputs: ['${workspace}/logs/discrete/mllm_list.yaml']
